<header>
    <h1>Inline editing result table</h1>
</header>
<div class="example">
    <mz-result-table [options]="{ hidePagination: true }" [model]="defaultModel()" [loading]="defaultLoadingState.loading" [error]="defaultLoadingState.error">
        <ng-template #headerTemplate>
            <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Status</th>
                <th>Date</th>
                <th>Total</th>
                <th>Country</th>
                <th>Edit</th>
            </tr>
        </ng-template>
        <ng-template #bodyTemplate ngForm #editForm="ngForm">
            @for(item of defaultModel()?.items; track $index) {
                <tr>
                    <td>{{ item.orderNumber }}</td>
                    <td class="inline-edit-column" >
                        <ng-container *ngIf="editingRow === item.orderNumber">
                            <input type="text" [(ngModel)]="model.customer" name="customer" #customerField="ngModel" class="form-input border"/>
                            <div class="field-error-container">
                                <mz-field-errors [field]="customerField"></mz-field-errors>
                            </div>
                        </ng-container>
                        <ng-container *ngIf="editingRow !== item.orderNumber">
                            {{ item.customer }}
                        </ng-container>
                    </td>
                    <td>{{ item.status }}</td>
                    <td>{{ item.date | date }}</td>
                    <td>{{ item.total | currency }}</td>
                    <td>{{ item.country }}</td>
                    <td class="w-40">
                        <button class="button button-secondary mr-2" (click)="editingRow === item.orderNumber ? stopEditing() : startEditing(item)">
                            <mz-svg-icon [key]="getIconKey(item.orderNumber!)" class="edit-icon"></mz-svg-icon>
                        </button>
                        <button class="button button-secondary" (click)="cancelEditing()" *ngIf="editingRow === item.orderNumber">
                            <mz-svg-icon key="x-circle" type="solid"></mz-svg-icon>
                        </button>
                    </td>
                </tr>
            }
        </ng-template>
    </mz-result-table>
</div>
