<header>
    <h1>Filter options component</h1>
    <p class="prose">Use this component to search and select options. It allows for both single and multiple selections.</p>
</header>

<article>
    <div class="example">
        <mz-filter [menuTemplate]="filterMenu1" (apply)="applyFilter('options', $event)" (clear)="clearFilter('options')">
            <ng-template #filterMenu1>
                <form #myForm="ngForm" [ngFormOptions]="{ updateOn: 'submit' }" (ngSubmit)="applyFilter2(myForm.value)">
                    <label class="field">
                        <mz-checkbox-group [(ngModel)]="model.options" [options]="months" name="options"></mz-checkbox-group>
                    </label>
                    <button (click)="applyFilter2(myForm.value)" class="mb-8" type="button">test</button>
                </form>
            </ng-template>
        </mz-filter>
    </div>
</article>

<article>
    <div class="example">
        <mz-options-filter [options]="options" [values]="values"> </mz-options-filter>
    </div>
</article>

<article>
    <div class="example">
        <div>
            {{ model | json }}
        </div>
        <div>
            <button class="button button-tertiary" [cdkMenuTriggerFor]="singleOptionMenu">Single option</button>
            <ng-template #singleOptionMenu>
                <mz-filter-menu cdkMenu>
                    <form mzForm [schema]="schema" (ngSubmit)="applyDateRange()" [ngFormOptions]="{ updateOn: 'submit' }">
                        @for(option of singleOptionOptions; track $index) {
                        <label class="field-option">
                            <input type="radio" name="singleOption" [value]="option" class="form-radio" [(ngModel)]="model.singleOption" />
                            <span class="radio-label">{{ option }}</span>
                        </label>
                        }
                    </form>
                </mz-filter-menu>
            </ng-template>
        </div>

        <button class="button button-tertiary" [cdkMenuTriggerFor]="filterMenu1">Multiple options</button>
        <ng-template #filterMenu1>
            <mz-filter-menu cdkMenu>
                <form mzForm [schema]="schema" (ngSubmit)="applyDateRange()">
                    <label class="field-option">
                        <mz-checkbox-group [(ngModel)]="model.options" [options]="options" name="options"></mz-checkbox-group>
                    </label>
                </form>
            </mz-filter-menu>
        </ng-template>

        <button class="button button-tertiary" [cdkMenuTriggerFor]="filterMenu1">Filter with form</button>
        <ng-template #filterMenu1>
            <mz-filter-menu cdkMenu>
                <form mzForm [schema]="schema" (ngSubmit)="applyDateRange()">
                    <mz-field label="Start date">
                        <input [(ngModel)]="model.dateRange.startDate" class="form-input" name="startDate" type="date" />
                    </mz-field>
                    <mz-field label="End date">
                        <input [(ngModel)]="model.dateRange.endDate" class="form-input" name="endDate" type="date" />
                    </mz-field>
                </form>
            </mz-filter-menu>
        </ng-template>
    </div>
</article>
