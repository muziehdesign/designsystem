<header>
    <h1>Dropdown menu</h1>
    <p class="prose">Use a dropdown menu to group related commands.</p>
</header>

<div class="example">
    <div class="flex gap-5 items-center">
        <button mzButton [cdkMenuTriggerFor]="menu">Open item</button>
        <ng-template #menu>
            <div class="menu" cdkMenu>
                <button cdkMenuItem (cdkMenuItemTriggered)="openItem()">Option 1</button>
                <button cdkMenuItem (cdkMenuItemTriggered)="openItem()">Option 2</button>
                <button cdkMenuItem (cdkMenuItemTriggered)="openItem()">Option 3</button>
            </div>
        </ng-template>

        <button mzButton variant="tertiary" [cdkMenuTriggerFor]="menu2">
            Open another
            <!-- <mz-svg-icon key="chevron-down" type="solid"></mz-svg-icon> -->
            <svg class="size-5 text-gray-400" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon">
                <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"></path>
            </svg>
        </button>
        <ng-template #menu2>
            <div class="menu" cdkMenu>
                <button cdkMenuItem (cdkMenuItemTriggered)="openItem()">Option 1</button>
                <button cdkMenuItem (cdkMenuItemTriggered)="openItem()">Option 2</button>
                <button cdkMenuItem (cdkMenuItemTriggered)="openItem()">Option 3</button>
            </div>
        </ng-template>
    </div>
</div>
