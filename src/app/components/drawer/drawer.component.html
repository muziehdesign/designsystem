<header>
    <h1>Drawer</h1>
    <p class="prose">
        Use a drawer to display content in a sliding panel.
    </p>
</header>

<article>
    <h2>Example</h2>
    <p>
        Click the button to open a sliding drawer from the right side of the screen.
    </p>
    <div class="example">
        <button class="button button-primary" (click)="openDrawer()">Open Drawer</button>
    </div>
</article>

<article>
    <h2>Usage</h2>
    <ul class="list-disc list-inside">
        <li>The drawer container wraps dialog content to create a sliding panel effect.</li>
    </ul>
</article>
