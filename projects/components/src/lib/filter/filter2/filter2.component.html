<button cdkOverlayOrigin #trigger="cdkOverlayOrigin" (click)="toggleOverlay()" class="button button-secondary" [class.active]="open">
    Some label

    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
</button>
<ng-template 
    cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkconnectedoverlaydes] [cdkConnectedOverlayOpen]="open" [cdkConnectedOverlayPanelClass]="'dropdown-body'" (overlayOutsideClick)="dismiss()">
    <div>
        <ng-content></ng-content>

        <div class="flex">
            @if(menuForm.options.updateOn === 'submit') {
                <button type="button" class="button button-primary" (click)="apply()">Apply</button>
            }
            <button type="button" (click)="clear()">Clear</button>
        </div>
    </div>
</ng-template>
