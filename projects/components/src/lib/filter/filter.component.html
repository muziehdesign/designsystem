<button [cdkMenuTriggerFor]="filterMenu" (cdkMenuOpened)="onOpened()" (cdkMenuClosed)="onClosed()">my filter</button>
<ng-template #filterMenu>
    <div cdkMenu>
        <ng-container [ngTemplateOutlet]="content" *ngIf="isOpen"></ng-container>

        <input type="text" name="test" [(ngModel)]="label" />
        <button type="submit" class="button button-primary" (click)="applyFilter($event)">Apply</button>
        <button type="reset" class="button button-tertiary" (click)="clearFilter()">Clear</button>
    </div>
</ng-template>

<ng-template #content>
    <ng-content></ng-content>
</ng-template>
