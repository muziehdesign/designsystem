<button cdkOverlayOrigin #trigger="cdkOverlayOrigin" (click)="toggle()" class="button button-secondary" [class.active]="open">
    {{ label }}

    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
</button>
<ng-template 
    cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkconnectedoverlaydes] [cdkConnectedOverlayOpen]="open" (overlayOutsideClick)="collapse()">
    <div cdkTrapFocus [cdkTrapFocusAutoCapture]="true" class="dropdown-body">
        <ng-content></ng-content>
    </div>
</ng-template>
