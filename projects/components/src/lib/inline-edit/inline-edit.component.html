<form class="mz-inline-edit" [ngClass]="{ 'horizontal': layout === 'horizontal', 'vertical': layout === 'vertical' }">
    @if (isEditing || !label) {
    <ng-content></ng-content>
    } @else if (label && !isEditing) {
    <button type="button" class="label-button" (click)="activate()">
        <span>
            {{ label }}
        </span>
        <span class="text-secondary label-button-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712ZM19.513 8.199l-3.712-3.712-12.15 12.15a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32L19.513 8.2Z" />
            </svg>
        </span>
    </button>
    } @if (isEditing) {
    <div class="edit-buttons">
        <button type="submit" mz-button [busy]="busy" (click)="submitForm()">Save</button>
        <button type="button" mz-button appearance="subtle" (click)="cancelEdit()">Cancel</button>
    </div>
    }
</form>
