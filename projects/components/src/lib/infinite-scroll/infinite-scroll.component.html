<div class="infinite-scroll-container overflow-auto" [style.height]="containerHeight" (scroll)="onContainerScroll($event)">
  @if (itemTemplate) {
    @for (item of items; track $index) {
      <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
    }
  } @else {
    @for (item of items; track $index) {
      <div class="scroll-item" [ngClass]="{'scroll-item-selected': selectedItem === item}" (click)="onItemClick(item)">
        {{ item.label }}
      </div>
    }
  }

  <!-- Spinner -->
  @if (isLoading) {
    <div class="scroll-spinner-container">
      <mz-spinner size="medium" type="secondary"></mz-spinner>
    </div>
  }
</div>
