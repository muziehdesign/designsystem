<div [className]="'alert alert-' + appearance()">
    <div>
        <div class="alert-icon">
            <mz-svg-icon [key]="getAlertIcon()"></mz-svg-icon>
        </div>

        <div class="alert-title">{{ title() }}</div>
    </div>

    <div class="alert-body">
        <ng-content></ng-content>
    </div>
</div>
