<div class="pagination-wrapper">
    <nav class="pagination-nav" aria-label="pagination">
        <button class="page-link page-icon-link" [class.disabled]="page === 1" (click)="changePageNumber(page - 1)">
            <span class="sr-only">Previous page</span>
            <mz-svg-icon key="chevron-left-solid"></mz-svg-icon>
        </button>
        @for(p of pages; track p) {
            @if(isEllipsis(p)) {
                <span class="page-ellipsis page-link disabled">...</span>
            } @else {
                <button class="page-link" [class.active]="p === page" (click)="changePageNumber(p)">{{ p }}</button>
            }
        }

        <button class="page-link page-icon-link" [class.disabled]="page === pageCount" (click)="changePageNumber(page + 1)">
            <span class="sr-only">Next page</span>
            <mz-svg-icon key="chevron-right-solid"></mz-svg-icon>
        </button>
    </nav>
    <div class="pagination-size">
        Show
        <select #c (change)="changePageSize(c.value)" name="pageSizeControl" class="page-size-control">
            @for(size of pageSizeOptions; track size) {
                <option [attr.selected]="pageSize == size ? true : null" [value]="size">{{ size }}</option>
            }
        </select>
        per page
    </div>
</div>
