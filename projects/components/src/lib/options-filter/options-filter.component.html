<button cdkOverlayOrigin #trigger="cdkOverlayOrigin" (click)="toggleOverlay()" class="button button-secondary" [class.active]="open">
    @if (options) {
        {{ filterLabel }}
        <span class="dropdown-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="dropdown-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
        </span>
    } @else {
        <mz-spinner></mz-spinner>
    }
</button>
<ng-template 
    cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkConnectedOverlayOpen]="open" [cdkConnectedOverlayPanelClass]="'dropdown-body'" (overlayOutsideClick)="dismiss()">
    <div>
        <form #myForm="ngForm" > 
            <div>
                <label class="field">
                    <input type="text" [(ngModel)]="search" placeholder="Search..." name="search" class="form-input" autocomplete="off" />
                </label>
                <div class="dropdown-options">
                    @for(option of filteredOptions; track option.value) {
                        <label class="field-option" [class.active]="selected === option.value">
                            <input class="form-radio" type="radio" [(ngModel)]="selected" name="option" [value]="option.value" (ngModelChange)="apply()"/>
                            <span class="radio-label">{{ option.label }}</span>
                        </label>
                    }
                </div>
            </div>
            <div class="dropdown-buttons">
                <button type="button" class="button button-tertiary"  (click)="clear()">Clear</button>
            </div>
        </form>
    </div>
</ng-template>
