<button cdkOverlayOrigin #trigger="cdkOverlayOrigin" (click)="toggleOverlay()" class="button button-secondary" [class.active]="open">
    {{ label }}

    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
</button>
<ng-template 
    cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkConnectedOverlayOpen]="open" [cdkConnectedOverlayPanelClass]="'dropdown-body'" (overlayOutsideClick)="dismiss()">
    <div>
        <form #myForm="ngForm" (submit)="apply()" [ngFormOptions]="{updateOn: 'submit'}"> 
            <div>
                @for(option of options; track option.value) {
                    <label class="field-option">
                        <input class="form-checkbox" type="checkbox" [ngModel]="option.selected" (ngModelChange)="toggleOption(option)" name="{{option.value}}" />
                        <span class="checkbox-label">{{ option.label }}</span>
                    </label>
                }
            </div>
            <div class="flex">
                <button type="submit" class="button button-primary">Apply</button>
                <button type="button" (click)="clear()">Clear</button>
            </div>
        </form>
    </div>
</ng-template>
