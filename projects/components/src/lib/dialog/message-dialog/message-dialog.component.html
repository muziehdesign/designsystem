@if(data.topRightXButton) {
<div class="relative">
    <button (click)="close()" class="absolute top-0 right-0 hover:opacity-70 transition-opacity" aria-label="Close">
        <mz-svg-icon key="x-outline" />
    </button>
</div>
}
<mz-dialog-header [title]="data.title"></mz-dialog-header>
<mz-dialog-content>
    {{ data.message }}
</mz-dialog-content>
<mz-dialog-footer>
    @if(data.cancelAction.length > 0 ) {
    <button (click)="close()" mz-button appearance="subtle">{{ data.cancelAction }}</button>
    } @if(data.action.length > 0) {
    <button (click)="ok()" cdkFocusInitial mz-button [appearance]="data.appearance || 'primary'">{{ data.action }}</button>
    }
</mz-dialog-footer>
